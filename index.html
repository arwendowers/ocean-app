<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oceandex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      text-align: center;
      color: white;
      font-family: 'Figtree', system-ui, sans-serif;
      background-image: url('jellyfishes.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0;
    }
    body h1 {
      font-size: 50px;
      text-shadow: 5px 5px 15px black;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
      font-weight: bold;
      text-shadow: 5px 5px 15px black;
    }
    .submit-btn {
      background: white;
      color: black;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 5px;
      padding: 3px 5px;
      -webkit-appearance: none;
      appearance: none;
    }
    img {
      display: block;
      margin: auto;
    }
    #ocean-species:not(:empty) {
      background-color: rgb(7, 39, 86);
      border: 3px solid white;
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      max-width: 900px;
      margin: auto;
      box-sizing: border-box;
    }
    .species-card {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      text-align: left;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
    }
    .species-img {
      width: 400px;
      height: auto;
      max-height: 370px;
      object-fit: cover;
      margin-top: 5px;
    }
    .species-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .species-tags {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
    }
    .category {
      background: transparent;
      padding: 6px 10px;
      border-radius: 999px;
      border: 2px solid white;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin: 0;
    }
    .conservation_status {
      background: transparent;
      padding: 6px 10px;
      border-radius: 999px;
      border: 2px solid;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin: 0;
    }
    .conservation_status.LC { border-color: #22c55e; color: #22c55e; }
    .conservation_status.NT { border-color: #84cc16; color: #84cc16; }
    .conservation_status.VU { border-color: #eab308; color: #eab308; }
    .conservation_status.EN { border-color: #f97316; color: #f97316; }
    .conservation_status.CR { border-color: #ef4444; color: #ef4444; }
    .conservation_status.EW { border-color: #a855f7; color: #a855f7; }
    .conservation_status.EX { border-color: #6b7280; color: #6b7280; }
    .conservation_status.DD { border-color: #9ca3af; color: #9ca3af; }
    .conservation_status.NE { border-color: #d1d5db; color: #d1d5db; }
    .species-info {
      flex: 1;
    }
    .common_name {
      margin-top: 0;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      padding-right: 45px;
    }
    .scientific_name {
      font-style: italic;
      margin-top: 0;
      margin-bottom: 1.5rem;
    }
    .short_description {
      margin-bottom: 2rem;
    }
    .save-fav {
      position: absolute;
      top: 0;
      right: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.3rem;
      background: transparent;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid white;
      color: white;
      padding: 0;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .save-fav.saved {
      background: white;
      color: rgb(7, 39, 86);
      border-color: white;
    }
    #open-favorites {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid white;
      background: rgb(7, 39, 86);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      background: rgb(7, 39, 86);
      color: white;
      border: 3px solid white;
      border-radius: 15px;
      padding: 24px;
      width: 90%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      text-align: left;
    }
    .modal-content h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #close-favorites {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      color: white;
      font-size: 2rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #favorites-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }
    .favorite-item {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .fav-view {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 0;
      text-align: center;
      font-family: inherit;
      width: 100%;
    }
    .fav-view img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
    }
    .fav-view span {
      font-size: 0.9rem;
      font-weight: 600;
      display: block;
    }
    .fav-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile */
    @media (max-width: 800px) {
      body {
        padding: 20px;
      }
      body h1 {
        font-size: 2.2rem;
      }
      .species-card {
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .species-left {
        align-items: center;
        width: 100%;
      }
      .species-img {
        width: 100%;
        max-width: 100%;
        max-height: 280px;
      }
      .species-tags {
        justify-content: center;
        flex-wrap: wrap;
      }
      .species-info {
        width: 100%;
        text-align: left;
      }
      .common_name {
        font-size: 1.5rem;
      }
      .save-fav {
        width: 40px;
        height: 40px;
        font-size: 1.4rem;
        top: 16px;
        right: 16px;
      }
      #open-favorites {
        top: 10px;
        right: 10px;
        padding: 6px 12px;
        font-size: 0.85rem;
      }
      .modal-content {
        width: 94%;
        max-width: none;
        max-height: 85vh;
        padding: 20px 16px;
        margin: 0 8px;
      }
      .modal-content h2 {
        font-size: 1.4rem;
        margin-bottom: 12px;
      }
      #favorites-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .fav-view img {
        height: 100px;
      }
      .fav-view span {
        font-size: 0.8rem;
      }
      #close-favorites {
        top: 8px;
        right: 8px;
        width: 36px;
        height: 36px;
        font-size: 24px;
      }
      .fav-remove {
        width: 28px;
        height: 28px;
        font-size: 20px;
        -webkit-appearance: none;
        appearance: none;
      }
    }

    @media (max-width: 420px) {
      form {
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      form input {
        width: 100%;
        max-width: 260px;
        height: 25px;
      }
      .submit-btn {
        width: auto;
        padding: 7px 18px;
        font-size: 1rem;
        margin-left: 0;
      }
    }

    /* Tablets */
    @media (min-width: 801px) and (max-width: 900px) {
      #ocean-species:not(:empty) {
        margin-left: 16px;
        margin-right: 16px;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <h1>Oceandex</h1>
  <form>
    <label for="speciesName">Enter a marine species:&nbsp;</label>
    <input type="text" name="speciesName" id="speciesName">
    <button type="submit" class="submit-btn">Submit</button>
  </form>

  <div id="ocean-species"></div>

  <button id="open-favorites" type="button" aria-label="Open favorites">Favorites</button>
  <div id="favorites-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-favorites" type="button" aria-label="Close favorites">×</button>
      <h2>Favorites</h2>
      <div id="favorites-list"></div>
    </div>
  </div>
  
  <script src="index.js"></script>
</body>
</html>
